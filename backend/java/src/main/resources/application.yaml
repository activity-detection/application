spring:
  application.name: video_storage_backend
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 10MB

  jpa:
    hibernate.ddl-auto: none

activity-detector:
  video:
    folderPath: ${VIDEO_FOLDER_PATH:videos} #Sciezka wzieta ze zmiennej srodowiskowej lub jezeli jej nie ma domyslna wartosc videos
    subfolderDepth: 1 #Liczba poziomów subfolderów w katalogu z video. 0 oznacza brak subfolderow w katalogu.

  # Catalog of elements the detector can report. Names must match the detector's
  # internal vocabulary (BASE_YOLO + LSTM actions + scene keys); "human" is the
  # UI-friendly word the detector aliases back to its internal "person" key.
  detected-elements:
    - human
    - bicycle
    - car
    - bird
    - cat
    - dog
    - handbag
    - suitcase
    - knife
    - normal
    - jumping_jacks
    - squats
    - falling
    - running
    - forbidden_zone
    - crowd

springdoc.api-docs.enabled: true
springdoc.swagger-ui.enabled: false
springdoc:
  default-operation-id-generation-mode: method

server.forward-headers-strategy: framework
