services:
  db:
    build:
      context: ../../backend/db/
      dockerfile: .Dockerfile
    container_name: ac_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: activitydetectordb
    networks:
      - backend-net
    ports:
      - "5433:5432"
    restart: on-failure:5
    volumes:
      - ac-data-vol:/var/lib/postgresql/data

  backend:
    build:
      context: ../../backend/java/
      dockerfile: .Dockerfile
    container_name: ac_backend
    depends_on:
      - db
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    networks:
      - backend-net
    ports:
      - "8080:8080"
    restart: on-failure:5

  frontend:
   build:
      context: ../../frontend/
      dockerfile: .Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/
   container_name: ac_frontend
   depends_on:
    - backend
   environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8080/
   networks:
    - frontend-net
   ports:
    - "3000:3000"
   restart: on-failure:5

  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx:1.29.5-alpine
    networks:
      - frontend-net
      - backend-net
    ports:
      - "80:80"
      # - "443:443"
    restart: on-failure:5
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  ac-data-vol:

networks:
  frontend-net:
  backend-net:
