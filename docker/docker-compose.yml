services:
  db:
    build:
      context: ../../backend/db/
      dockerfile: .Dockerfile
    container_name: ac_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: activitydetectordb
    networks:
      - backend-net
    ports:
      - "55433:5432"
    restart: on-failure:5
    volumes:
      - ac-data-vol:/var/lib/postgresql/data

  backend:
    build:
      context: ../../backend/java/
      dockerfile: .Dockerfile
    container_name: ac_backend
    depends_on:
      - db
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost
    networks:
      - backend-net
    ports:
      - "8080:8080"
    restart: on-failure:5

  frontend:
   build:
      context: ../../frontend/
      dockerfile: .Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost/api
   container_name: ac_frontend
   depends_on:
    - backend
   environment:
    - NEXT_PUBLIC_API_BASE_URL=http://localhost/api
   networks:
    - frontend-net
   ports:
    - "3000:3000"
   restart: on-failure:5

  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx:1.29.5-alpine
    networks:
      - frontend-net
      - backend-net
    ports:
      - "80:80"
      # - "443:443"
    restart: on-failure:5
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro

  detector:
    build:
      context: ../../detector
      dockerfile: Dockerfile
    env_file: "../../detector/.env"
    environment:
      - BACKEND_UPLOAD_URL=http://backend:8080/videos/upload
      - UPLOAD_CLIPS=True
      - SAVE_CLIPS=False
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
    - backend
    - nginx
    networks:
      - backend-net
      - frontend-net


volumes:
  ac-data-vol:

networks:
  frontend-net:
  backend-net:
