services:
  db:
    build:
      context: backend/db/
      dockerfile: .Dockerfile
    container_name: ac_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: activitydetectordb
    networks:
      - backend-net
    ports:
      - "55433:5432"
    volumes:
      - ac-data-vol:/var/lib/postgresql/data

  backend:
    build:
      context: backend/java/
      dockerfile: dev.Dockerfile
    container_name: ac_backend
    depends_on:
      - db
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
    networks:
      - backend-net
      - frontend-net
    ports:
      - "8080:8080"
    volumes:
      - ./backend/java/src/main/resources:/app/config

  frontend:
    build:
      context: frontend/
      dockerfile: dev.Dockerfile
    container_name: ac_frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost/api
      # WSL2/Docker bind mounts don't deliver inotify events; poll so Next HMR sees edits
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - frontend-net
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx:1.29.5-alpine
    networks:
      - frontend-net
      - backend-net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  detector:
    build:
      context: detector
      dockerfile: Dockerfile
    env_file: "detector/.env.dev"
    environment:
      - CLIP_FOLDER=/clips
      - BACKEND_UPLOAD_URL=http://backend:8080/videos/upload
      - ACTION_VECTORS_PATH=/app/vectors/vectors2.csv
      - BACKEND_CONFIG_URL=http://backend:8080/detector/config
      - UPLOAD_CLIPS=True
      - SAVE_CLIPS=True
    volumes:
      - type: bind
        source: detector/clips
        target: /clips
      - type: bind
        source: detector/vectors
        target: /app/vectors
        read_only: true
      - type: bind
        source: detector/data
        target: /app/data
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - backend
      - nginx
    networks:
      - backend-net
      - frontend-net

volumes:
  ac-data-vol:

networks:
  frontend-net:
  backend-net: