services:
  db:
    build:
      context: backend/db/
      dockerfile: .Dockerfile
    container_name: ac_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: activitydetectordb
    networks:
      - backend-net
    ports:
      - "55433:5432"
    volumes:
      - ac-data-vol:/var/lib/postgresql/data

  backend:
    build:
      context: backend/java/
      dockerfile: dev.Dockerfile
    container_name: ac_backend
    depends_on:
      - db
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
    networks:
      - backend-net
      - frontend-net
    ports:
      - "8080:8080"
    volumes:
      - ./backend/java/src/main/resources:/app/config
    healthcheck:
      test: [ "CMD-SHELL", 'wget -qO- http://localhost:8080/actuator/health | grep -q ''"status":"UP"''' ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: frontend/
      dockerfile: dev.Dockerfile
    container_name: ac_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://nginx/api
    networks:
      - frontend-net
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  nginx:
    depends_on:
      - frontend
      - backend
    image: nginx:1.29.5-alpine
    networks:
      - frontend-net
      - backend-net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    container_name: ac_playwright
    depends_on:
      - nginx
    networks:
      - frontend-net
      - backend-net
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - CI=1
      - PLAYWRIGHT_BASE_URL=http://nginx
      - TEST_BASE_URL=http://backend:8080
      - API_PREFIX=/
    command: >
      bash -lc " ./upload_videos.sh &&  cd frontend &&  npm ci &&  npx playwright test "

volumes:
  ac-data-vol:

networks:
  frontend-net:
  backend-net:
